rubrics:
  - id: 1
    type: p2p
    text: 首选名称空闲或资源已由当前 IngressRoute UID 控制时，Certificate 继续使用路由名加 -tls 后缀，DNSEndpoint 继续使用路由名，现有 spec、managed-by、annotations 和 ownerReference 更新结果保持兼容。
  - id: 2
    type: f2p
    text: 首选名称被无 owner、其他 controller 或不同 IngressRoute UID 的 Certificate/DNSEndpoint 占用时，原对象的 spec 与 metadata 均保持不变，并为当前 parent 创建符合 Kubernetes 命名限制的确定替代 child；重复 reconcile 和 manager 重启不会产生副本。
  - id: 3
    type: f2p
    text: Certificate 与 DNSEndpoint 的非 owned 对象更新或删除会按首选名称精确映射到相关 IngressRoute，冲突解除无需修改 parent 即可触发恢复；无关对象事件不会 enqueue 全部路由或改变其他资源。
  - id: 4
    type: f2p
    text: 首选名称重新可用时，两类 integration 都先创建/修复由当前 UID 拥有的首选 child，再删除其替代 child；首选创建、metadata 设置或删除阶段失败会返回可重试错误，并保留至少一个上次有效的自有资源供后续收敛。
  - id: 5
    type: f2p
    text: TLS secret 或 hosts 消失时，只删除当前 UID 实际拥有的首选或替代资源；同名外来、无 owner、其他 controller 或旧 UID 对象全部保留，替代 child 不会泄漏。
  - id: 6
    type: f2p
    text: 同名 IngressRoute 删除后以新 UID 重建时，新对象不会采用或改写旧 UID child；旧资源按原 owner 生命周期处理，新 parent 在冲突存在或解除后都能收敛到自己的稳定资源。
  - id: 7
    type: p2p
    text: 当前 UID 拥有的 child 被手工删除或修改后仍通过既有 owned-resource 事件重建/修复；无冲突证书、DNS targets、route 删除、Service watch 和 integration/controller 测试保持回归通过。
